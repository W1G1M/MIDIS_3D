<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title></title>
    <script src="babylon.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="error-log"></div>
    <div id="floor-controls">
        <button id="btn-floor-4" onclick="switchFloor('4')">4</button>
        <button id="btn-floor-3" onclick="switchFloor('3')">3</button>
        <button id="btn-floor-2.5" onclick="switchFloor('2.5')">2.5</button>
        <button id="btn-floor-2" onclick="switchFloor('2')">2</button>
        <button id="btn-floor-1" class="active" onclick="switchFloor('1')">1</button>
    </div>
    <div id="info-panel">МИДиС — Этаж 1 (Кликни на кабинет)</div>
    <div id="search-bar">
        <input type="text" id="search-input" placeholder="Найти аудиторию (например: 122, 241, 346, 403)..." oninput="searchRoom(this.value)">
    </div>
    <canvas id="renderCanvas"></canvas>

    <script src="app.js"></script>
</body>
</html>
